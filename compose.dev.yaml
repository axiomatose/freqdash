# Canonical Docker gate (Linux, Node 22, clean node_modules):
#   docker compose -f compose.dev.yaml run --rm tools sh -c "npm ci && npm run verify"
services:
  tools:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      - CI=true
      - NEXT_TELEMETRY_DISABLED=1
      # better-sqlite3 ships prebuilt binaries. Without this npm runs an implicit `node-gyp rebuild` for it,
      # which fails on this slim image (no python/make/g++).
      - npm_config_ignore_scripts=true
    volumes:
      - .:/app
      - freqdash_node_modules:/app/node_modules
volumes:
  freqdash_node_modules: {}
